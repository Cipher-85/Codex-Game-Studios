name: CCGS Runtime Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate installed CCGS runtime
        run: ./.codex/audit.sh all --root "$PWD"
